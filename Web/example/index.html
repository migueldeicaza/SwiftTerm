<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>SwiftTerm Canvas example</title>
<style>body{margin:2rem;background:#17191d;color:#eee;font:16px system-ui}.terminal{position:relative;width:max-content;max-width:100%;outline:1px solid #777}canvas{display:block;max-width:100%}textarea{position:absolute;width:1px;height:20px;padding:0;border:0;opacity:.01;resize:none;overflow:hidden;color:transparent;caret-color:transparent}p{max-width:65ch;line-height:1.5}</style>
<h1>SwiftTerm Canvas example</h1><div class="terminal"><canvas aria-label="Terminal output"></canvas><textarea aria-label="Terminal input" autocomplete="off" autocapitalize="off" spellcheck="false"></textarea></div>
<p>SwiftTerm supplies the terminal engine. Canvas draws the copied rows. Text metrics, shaping, font fallback, BiDi, ligatures, and emoji can differ from the native renderer.</p>
<p>This example has a local data stream. It does not start a shell or connect to a PTY.</p>
<script type="module" src="../dist/example/main.js"></script></html>
