name: Swift

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  DEVELOPER_DIR: /Applications/Xcode_27.1.app/Contents/Developer
  # Debug builds skip the checks that walk a whole row unless this is set.
  SWIFTTERM_EXPENSIVE_ASSERTS: "1"

jobs:
  build:

    runs-on: xcode-27

    steps:
    - uses: actions/checkout@v4

    - name: Show toolchain versions
      run: |
        xcodebuild -version
        swift --version

#    - name: Checkout esctest for testing
#      uses: actions/checkout@v4
#      with:
#        repository: migueldeicaza/esctest
#        ref: python3
#        path: esctest

    - name: List all files, because this is driving me insane, this does not repro anywhere but github
      run: ls -lR

    - name: Xcode Mac Build
      run: xcodebuild -project TerminalApp/MacTerminal.xcodeproj -scheme MacTerminal

    - name: Xcode iOS Build
      run: |
        xcodebuild -project TerminalApp/iOSTerminal.xcodeproj -scheme iOSTerminal -destination 'generic/platform=iOS' CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO

    - name: Swift Package Build
      run: swift build -v

    # Fails if a hot-path type gets a run-time field layout (see PERFORMANCE.md).
    - name: Check fixed field layout
      run: scripts/check-fixed-layout.sh

    - name: Check generated Unicode widths
      run: python3 scripts/regen_unicode_width_data.py --check

    - name: Run tests
      run: swift test --no-parallel -v

    - name: Coverage
      run: |
        swift test --no-parallel --enable-code-coverage
        # Ask SwiftPM for the paths: the bundle name and the profile directory
        # depend on the build system.
        BINDIR=$(swift build --show-bin-path)
        PROFDATA="$(dirname "$(swift test --show-codecov-path)")/default.profdata"
        XCTEST=$(find "$BINDIR" -maxdepth 1 -name '*.xctest' | head -n 1)
        xcrun llvm-cov report "$XCTEST/Contents/MacOS/$(basename "$XCTEST" .xctest)" --instr-profile="$PROFDATA" -use-color

  esctest:

    # DEVELOPER_DIR above names Xcode 27.1, which only the xcode-27 runners have.
    runs-on: xcode-27

    steps:
    - uses: actions/checkout@v4

    - name: Fetch esctest
      run: make clone-esctest

    # Fails the build if a test in Tests/SwiftTermTests/Fixtures/esctest-known-good.txt fails.
    - name: Known-good esctest tests
      run: swift test --filter testKnownGood

    # Only reports: the summary lists esctest's tally and the failing tests.
    - name: Full esctest run
      if: always()
      continue-on-error: true
      env:
        ESCTEST_REPORT_LOG: ${{ github.workspace }}/esctest.log
      run: swift test --filter testFullSuiteReport

    - name: esctest summary
      if: always()
      run: |
        {
          echo '## esctest'
          echo
          grep 'tests passed' esctest.log || echo 'esctest wrote no summary.'
          echo
          echo '```'
          sed -n '/^Failing tests:$/,$p' esctest.log
          echo '```'
        } >> "$GITHUB_STEP_SUMMARY"

    - name: Upload esctest log
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: esctest-log
        path: esctest.log
        if-no-files-found: ignore

  thread-sanitizer:

    runs-on: xcode-27

    steps:
    - uses: actions/checkout@v4

    - name: Stage A Thread Sanitizer Tests
      run: swift test --no-parallel --sanitize=thread --filter "TerminalLocking|SynchronizedOutput|TerminalIOPipeline"

  swiftpm-strict-concurrency:

    runs-on: xcode-27

    steps:
    - uses: actions/checkout@v4

    - name: Build SwiftTerm with complete concurrency checking
      run: >-
        swift build --target SwiftTerm
        -Xswiftc -strict-concurrency=complete

  swift6-tools:

    runs-on: xcode-27

    steps:
    - uses: actions/checkout@v4

    - name: Build SwiftTerm benchmarks
      env:
        BENCHMARK_DISABLE_JEMALLOC: "1"
      run: swift build --package-path Tools/SwiftTermBenchmarks

    - name: Build RenderBench
      run: swift build --package-path Tools/RenderBench

    - name: Build and test BidiHarness
      run: >-
        xcodebuild
        -project Tools/BidiHarness/BidiHarness.xcodeproj
        -scheme BidiHarness
        -destination 'platform=macOS'
        test
        CODE_SIGNING_ALLOWED=NO

  linux-headless:

    runs-on: ubuntu-latest
    container: swift:6.2-jammy

    steps:
    - uses: actions/checkout@v4

    - name: Build SwiftTerm
      run: swift build --target SwiftTerm

    - name: Build SwiftTerm with complete concurrency checking
      run: >-
        swift build --target SwiftTerm
        -Xswiftc -strict-concurrency=complete

    - name: Run headless tests
      run: >-
        swift test --no-parallel
